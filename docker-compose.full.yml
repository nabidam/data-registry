services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mtreg
      POSTGRES_PASSWORD: mtreg
      POSTGRES_DB: mtreg
    ports:
      # 5433 on the host to avoid clashing with a local Postgres install
      - "5433:5432"
    volumes:
      # Postgres 18 images want a single mount at /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtreg"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mtreg &&
      echo bucket ready"

  backend:
    build:
      context: ./backend
      args:
        INSTALL_EVALUATION: ${INSTALL_EVALUATION:-false}
    command: ["/app/entrypoint.sh"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_BACKEND: s3
      S3_BUCKET: mtreg
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      WORK_DIR: /tmp/mtreg
      IMPORT_STREAM_THRESHOLD_MB: ${IMPORT_STREAM_THRESHOLD_MB:-512}
      IMPORT_BATCH_ROWS: ${IMPORT_BATCH_ROWS:-50000}
      EVALUATION_CANDIDATE_LIMIT: ${EVALUATION_CANDIDATE_LIMIT:-50000}
      EVALUATION_CANDIDATE_MULTIPLIER: ${EVALUATION_CANDIDATE_MULTIPLIER:-10}
      HF_HOME: /root/.cache/huggingface
      DEBUG: "${DEBUG:-false}"
    ports:
      # 8001 on the host to stay clear of other local services on 8000
      - "8001:8000"
    volumes:
      - ${HOST_HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        INSTALL_EVALUATION: ${INSTALL_EVALUATION:-false}
    command: ["/app/entrypoint.sh", "worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_BACKEND: s3
      S3_BUCKET: mtreg
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      WORK_DIR: /tmp/mtreg
      IMPORT_STREAM_THRESHOLD_MB: ${IMPORT_STREAM_THRESHOLD_MB:-512}
      IMPORT_BATCH_ROWS: ${IMPORT_BATCH_ROWS:-50000}
      EVALUATION_CANDIDATE_LIMIT: ${EVALUATION_CANDIDATE_LIMIT:-50000}
      EVALUATION_CANDIDATE_MULTIPLIER: ${EVALUATION_CANDIDATE_MULTIPLIER:-10}
      HF_HOME: /root/.cache/huggingface
      DEBUG: "${DEBUG:-false}"
    volumes:
      - ${HOST_HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - importwork:/tmp/mtreg
    restart: unless-stopped
    cpus: ${IMPORT_WORKER_CPUS:-2.0}
    mem_limit: ${IMPORT_WORKER_MEMORY_LIMIT:-8g}
    stop_grace_period: 30s
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: /api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  importwork:
