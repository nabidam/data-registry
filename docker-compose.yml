services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mtreg
      POSTGRES_PASSWORD: mtreg
      POSTGRES_DB: mtreg
    ports:
      # 5433 on the host to avoid clashing with a local Postgres install
      - "5433:5432"
    volumes:
      # Postgres 18 images want a single mount at /var/lib/postgresql
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtreg"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mtreg &&
      echo bucket ready"

  backend:
    build: ./backend
    command: ["/app/entrypoint.sh", "--reload"]
    environment:
      DATABASE_URL: postgresql+asyncpg://mtreg:mtreg@postgres:5432/mtreg
      STORAGE_BACKEND: s3
      S3_BUCKET: mtreg
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      WORK_DIR: /tmp/mtreg
      DEBUG: "true"
    ports:
      # 8001 on the host to stay clear of other local services on 8000
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: /api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
