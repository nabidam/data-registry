services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mtreg &&
      echo bucket ready"

  backend:
    build:
      context: ./backend
      args:
        INSTALL_EVALUATION: ${INSTALL_EVALUATION:-false}
    command: ["/app/entrypoint.sh", "--reload"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_BACKEND: s3
      S3_BUCKET: mtreg
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: "false"
      WORK_DIR: /tmp/mtreg
      HF_HOME: /root/.cache/huggingface
      DEBUG: "true"
    ports:
      # 8001 on the host to stay clear of other local services on 8000
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ${HOST_HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: /api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  miniodata:
