# Policy imported from the supplied MT test-set builder.  It is deliberately
# deployment-owned: set EVALUATION_RESERVATION_CONFIG to use a different copy.
description: >-
  Contamination-safe evaluation reservation uses deterministic domain and
  length quotas, MinHash and embedding deduplication, LaBSE diversity-aware
  selection, document holdout, and an embedding near-duplicate purge.

input:
  # Input IDs such as "document:chunk" are reduced to the document portion.
  id_separator: ":"

selection:
  domain_allocation: flattened
  flatten_alpha: 0.5
  min_per_domain: 50
  length_buckets: [0, 15, 40, 80, 999999]
  length_bucket_shares: [0.20, 0.35, 0.30, 0.15]
  hard_phenomena_min_share:
    has_math: 0.08
    has_numbers_units: 0.15
    has_acronyms: 0.15
    has_mixed_script: 0.10
  rare_term_top_quantile: 0.90
  rare_term_min_share: 0.10
  # Two different bounds, for two different concerns.
  #
  # max_test_documents is about diversity: how many documents a benchmark spans.
  # It says nothing about cost, because document holdout removes every chunk of a
  # held document from training and documents are not the same size. A registry
  # of page-chunked books and standards averaged 8,051 rows per document, so a
  # cap of 30 quarantined 241,525 rows to reserve 399 — 605 rows of training data
  # per benchmark row. See docs/adr/005.
  #
  # max_holdout_share is about cost, and is the bound that matters: never spend
  # more than this fraction of the corpus on holdout, whatever the documents
  # weigh. Selection prefers documents that offer the most benchmark signal per
  # row spent, so the budget buys diversity rather than truncating it.
  # Set both to null to let selection use as many documents as necessary.
  max_test_documents: 200
  max_holdout_share: 0.01
  # Absolute ceiling, applied alongside the share. null leaves only the share.
  max_holdout_rows: null

features:
  rare_token_max_count: 3

dedup:
  # Every rejected duplicate is permanently QUARANTINED in the registry rather
  # than deleted, so it cannot enter training or an evaluation set.
  enabled: true
  minhash_enabled: true
  minhash_threshold: 0.85
  embedding_dedup_enabled: true
  embedding_cosine_threshold: 0.95

embeddings:
  # LaBSE is downloaded by sentence-transformers on the first eligible import
  # unless the Hugging Face cache already contains it. Set false for the same
  # TF-IDF + SVD fallback used by the source script.
  enabled: true
  model: sentence-transformers/LaBSE
  batch_size: 64
  device: auto
  cache_path: evaluation_reservation/embeddings.npy

diversity:
  strategy: kcenter
  # Random projection preserves useful cosine geometry while avoiding repeated
  # 768-dimensional k-center scans over the candidate pool.
  projection_dimensions: 128

contamination:
  document_level_holdout: true
  near_dup_check_enabled: true
  near_dup_cosine_threshold: 0.92
  # Which rows may be compared with each other. Selection and quotas are always
  # per language pair; this controls the contamination scan only.
  #   pair             identical src_lang + tgt_lang. Default; each pair protects itself.
  #   source_language  shares the source language, e.g. ru-fa against ru-en.
  #   target_language  shares the target language, e.g. ru-fa against en-fa.
  #                    Detects the same Persian material arriving via several source
  #                    languages, but that redefines contamination and removes rows
  #                    other pairs consider valid.
  #   any              every pair compared with every other. Advanced, opt-in.
  comparison_scope: pair
  # Applied when a comparison crosses languages on that side. LaBSE places a
  # translation and its source around 0.85-0.95, so the monolingual 0.92 would
  # quarantine ordinary translations. A cross-lingual match must be much closer
  # before it counts as duplication rather than equivalence.
  cross_lingual_cosine_threshold: 0.97
  # Exact target duplication is checked across every pair regardless of
  # comparison_scope: an identical target string in the training pool is output
  # the model memorizes, whatever language its source was written in. This is a
  # hash-set lookup, so widening it costs nothing.
  exact_target_duplication: true
  # Document IDs arrive from importers and are rarely globally unique; "doc:1"
  # collides between unrelated corpora during a registry-wide scan.
  #   source  namespace by source_id, so re-importing one corpus still shares
  #           documents but unrelated corpora do not. Default.
  #   batch   namespace by batch_id; disables cross-batch document holdout.
  #   none    trust the imported IDs as globally meaningful.
  document_namespace: source
  # Full-corpus LaBSE inference is limited to rows whose source or target shares
  # enough token shingles with the corresponding side of the reserved evaluation
  # pool. Two shared three-token shingles catch four-token passages and separated
  # overlap while avoiding a flood of candidates from one generic phrase.
  semantic_prefilter_shingle_size: 3
  semantic_prefilter_min_shared_shingles: 2

splits:
  dev_test_split: true
  dev_fraction: 0.5

gold_subset:
  enabled: true
  size: 120

# Per-language-pair overrides, deep-merged over everything above. The key is
# "<src>-<tgt>" using primary subtags, e.g. "ru-fa". Length buckets count source
# tokens, so a morphologically denser source language reaches the same meaning in
# fewer tokens and may want its own edges. Features the pair cannot measure are
# dropped automatically by its language profile; they do not need an override.
#
# pairs:
#   ru-fa:
#     selection:
#       length_buckets: [0, 12, 32, 70, 999999]
pairs: {}
