[project]
name = "mtdataregistry-backend"
version = "0.1.0"
description = "Machine Translation Dataset Registry - backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.1",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "duckdb>=1.1.3",
    "polars>=1.17",
    "fastexcel>=0.12",
    "pyarrow>=18.1",
    "pyyaml>=6.0",
    "boto3>=1.35",
    "rich>=13.9",
]

[dependency-groups]
dev = ["ruff>=0.8"]
evaluation = [
    "numpy>=2.0",
    "datasketch>=2.0.0",
    "scikit-learn>=1.9.0",
    "torch==2.8.0",
    "transformers>=4.57.6,<5.0",
    "sentence-transformers>=5.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Depends()/File() in argument defaults is the FastAPI idiom.
ignore = ["B008"]
